<!doctype html>
<html lang="es-CL">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Pastelería{% endblock %}</title>
    <style>
        :root {
            font-family: system-ui, sans-serif;
            color: #38251f;
            background: #fffaf5;
        }
        body { margin: 0; }
        header { background: #6b382e; color: white; }
        nav {
            max-width: 1100px;
            margin: auto;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a { color: white; text-decoration: none; }
        nav .brand { font-size: 1.25rem; font-weight: 700; }
        main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .filters { display: flex; flex-wrap: wrap; gap: .75rem; margin-bottom: 1.5rem; }
        input, select, button {
            font: inherit;
            padding: .6rem .75rem;
            border: 1px solid #cbb8aa;
            border-radius: .4rem;
        }
        button { background: #6b382e; color: white; cursor: pointer; }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.25rem;
        }
        .product, .detail {
            overflow: hidden;
            background: white;
            border: 1px solid #eadfd7;
            border-radius: .6rem;
        }
        .product img { width: 100%; height: 190px; object-fit: cover; }
        .product-info, .detail-info { padding: 1rem; }
        .product h2 { margin: 0 0 .4rem; font-size: 1.2rem; }
        .product a { color: inherit; text-decoration: none; }
        .price { color: #6b382e; font-weight: 700; font-size: 1.1rem; }
        .detail { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
        .detail img { width: 100%; height: 100%; max-height: 520px; object-fit: cover; }
        .detail-info dl { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
        .detail-info dt { font-weight: 700; }
        .detail-info dd { margin: 0; }
        .back-link { color: #6b382e; }
        .messages { padding: 0; list-style: none; }
        .messages li { padding: .8rem 1rem; background: #e6f4e8; border-radius: .4rem; }
        .order-form { max-width: 600px; margin: 2rem 0; }
        .order-form p { display: grid; gap: .35rem; }
        .errorlist { color: #a32121; }
    </style>
</head>
<body>
    <header>
        <nav aria-label="Menú principal">
            <a class="brand" href="{% url 'catalogo:inicio' %}">Pastelería</a>
            <div>
                <a href="{% url 'catalogo:inicio' %}">Catálogo</a>
                <a href="/admin/">Administración</a>
            </div>
        </nav>
    </header>
    <main>
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
